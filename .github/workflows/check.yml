name: Päivitä lounaat ja julkaise

on:
  push:
    branches: [master]
  schedule:
    # GitHubin cron käyttää UTC-aikaa. Epätasaiset minuutit vähentävät ruuhkaviiveitä.
    # Ajetaan puolen tunnin välein 05.17–16.47/06.17–17.47 Helsingin ajassa.
    - cron: "17,47 3-14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hae repo
        uses: actions/checkout@v6

      - name: Ota Node.js käyttöön
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Testaa parserit
        run: node --test

      - name: Päivitä päivän data
        run: node scripts/update-menu.mjs

      - name: Tallenna muuttunut lista
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          if ! git diff --cached --quiet; then
            git commit -m "Päivitä päivän lounaat"
            git push
          fi

      - name: Rakenna sivu
        run: node scripts/build.mjs

      - name: Valmistele GitHub Pages
        uses: actions/configure-pages@v5

      - name: Paketoi sivu
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Julkaise GitHub Pagesiin
        id: deployment
        uses: actions/deploy-pages@v4
